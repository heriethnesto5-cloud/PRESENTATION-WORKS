<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Pink Calculator</title>
</head>
<body>
    <main class="calculator-page">
        <section class="calculator" aria-labelledby="calculator-title">
            <div class="calculator-heading">
                <p class="eyebrow">Everyday maths</p>
                <h1 id="calculator-title">Simple <span>Calculator</span></h1>
                <p>A simple, friendly way to work things out.</p>
            </div>

            <div class="display-wrap">
                <label class="sr-only" for="display">Calculator display</label>
                <input id="display" class="display" type="text" value="0" readonly aria-label="Calculator display">
                <p id="message" class="message" role="status" aria-live="polite"></p>
            </div>

            <div class="calculator-keys" aria-label="Calculator buttons">
                <button class="key key-action" data-action="clear" type="button">C</button>
                <button class="key" data-value="7" type="button">7</button>
                <button class="key" data-value="8" type="button">8</button>
                <button class="key" data-value="9" type="button">9</button>
                <button class="key key-operator" data-value="/" type="button">&divide;</button>
                <button class="key" data-value="4" type="button">4</button>
                <button class="key" data-value="5" type="button">5</button>
                <button class="key" data-value="6" type="button">6</button>
                <button class="key key-operator" data-value="*" type="button">&times;</button>
                <button class="key" data-value="1" type="button">1</button>
                <button class="key" data-value="2" type="button">2</button>
                <button class="key" data-value="3" type="button">3</button>
                <button class="key key-operator" data-value="+" type="button">+</button>
                <button class="key" data-value="0" type="button">0</button>
                <button class="key key-operator" data-value="-" type="button">&minus;</button>
                <button class="key key-equals" data-action="calculate" type="button">=</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
